server:
  port: ${PORT:8088}

spring:
  application:
    name: fanwenjia
  datasource:
    url: ${COMPOSITION_DB_URL}
    username: ${COMPOSITION_DB_USERNAME}
    password: ${COMPOSITION_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${COMPOSITION_MAIL_HOST:smtp.163.com}
    port: ${COMPOSITION_MAIL_PORT:465}
    username: ${COMPOSITION_MAIL_USERNAME:VocabNote@163.com}
    password: ${COMPOSITION_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 5000

composition:
  auth:
    code-expire-minutes: 5
    code-resend-seconds: 60
  translation:
    provider:
      api-key: ${TRANSLATION_API_KEY:}
      base-url: ${TRANSLATION_BASE_URL:https://taotoken.net/api/v1}
      model: ${TRANSLATION_MODEL:}
      temperature: ${TRANSLATION_TEMPERATURE:0}
      structured-output: ${TRANSLATION_STRUCTURED_OUTPUT:true}
      disable-thinking: ${TRANSLATION_DISABLE_THINKING:true}
