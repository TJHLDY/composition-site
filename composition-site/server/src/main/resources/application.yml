server:
  port: 8088

spring:
  application:
    name: fanwenjia
  datasource:
    url: jdbc:h2:file:./data/fanwenjia;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

composition:
  translation:
    zhipu:
      api-key: ${ZHIPU_API_KEY:}
      base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      model: ${ZHIPU_MODEL:glm-5.2}
