<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PK 结算页预览</title>
  <style>
    :root {
      --cream: #f6f2ec;
      --paper: #fffdfa;
      --ink: #17213a;
      --muted: #7b8191;
      --line: #e5ded3;
      --blue: #486ca8;
      --blue-dark: #233f72;
      --gold: #c9a45c;
      --gold-soft: #f4ead3;
      --red: #c8554d;
      --red-soft: #f8e6e2;
      --green: #5a9a73;
      --green-soft: #e6f1ea;
      --shadow: 0 18px 55px rgba(42, 34, 24, 0.14);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background:
        linear-gradient(120deg, rgba(201,164,92,0.12), transparent 34%),
        linear-gradient(300deg, rgba(72,108,168,0.10), transparent 38%),
        var(--cream);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .settlement {
      width: min(1120px, 100%);
      background: rgba(255, 253, 250, 0.88);
      border: 1px solid rgba(229, 222, 211, 0.9);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(255,255,255,0.72), rgba(244,234,211,0.48));
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .title {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.8rem);
      letter-spacing: 0;
    }

    .scenario-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .scenario-tabs button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.18s ease;
      white-space: nowrap;
    }

    .scenario-tabs button.active {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
      box-shadow: 0 8px 20px rgba(72,108,168,0.24);
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 310px 1fr;
      align-items: stretch;
      gap: 18px;
      padding: 28px;
    }

    .player {
      position: relative;
      min-height: 360px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      overflow: hidden;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .player.winner {
      border-color: rgba(201,164,92,0.72);
      box-shadow: inset 0 0 0 1px rgba(201,164,92,0.15);
    }

    .player.loser {
      background: linear-gradient(180deg, #fffdfa, #faf6ef);
    }

    .player::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,164,92,0.16), transparent 42%);
      pointer-events: none;
    }

    .player-header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1;
    }

    .avatar-wrap {
      position: relative;
      width: 78px;
      height: 78px;
      flex: 0 0 auto;
    }

    .avatar {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 1.28rem;
      font-weight: 800;
      border: 4px solid #fff;
      box-shadow: 0 10px 24px rgba(23,33,58,0.16);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .crown {
      position: absolute;
      left: 50%;
      top: -18px;
      width: 34px;
      height: 24px;
      transform: translateX(-50%);
      color: var(--gold);
      filter: drop-shadow(0 4px 8px rgba(201,164,92,0.35));
    }

    .player-name {
      min-width: 0;
    }

    .player-name strong {
      display: block;
      font-size: 1.18rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-name span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .rank-pill {
      position: absolute;
      top: 20px;
      right: 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--blue);
      background: rgba(255,255,255,0.78);
      font-size: 0.82rem;
      font-weight: 700;
      z-index: 1;
    }

    .score-block {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
      margin-top: 34px;
    }

    .score-label {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .score {
      font-size: clamp(3rem, 7vw, 5.7rem);
      line-height: 0.95;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: 0;
    }

    .winner .score {
      color: var(--blue-dark);
      text-shadow: 0 8px 24px rgba(72,108,168,0.16);
    }

    .delta {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .delta.up {
      color: #2e7048;
      background: var(--green-soft);
    }

    .delta.down {
      color: #a63f39;
      background: var(--red-soft);
    }

    .stats {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.72);
      padding: 10px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 0.94rem;
    }

    .center {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .result-card {
      flex: 1;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(23,33,58,0.96), rgba(32,45,77,0.96));
      color: #fff;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 18px 38px rgba(23,33,58,0.25);
      position: relative;
      overflow: hidden;
    }

    .result-card::before,
    .result-card::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,164,92,0.8), transparent);
    }

    .result-card::before { top: 18px; }
    .result-card::after { bottom: 18px; }

    .round-tag {
      width: fit-content;
      margin: 0 auto 14px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--gold-soft);
      border: 1px solid rgba(201,164,92,0.42);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .result-title {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .series-score {
      margin: 14px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.78);
    }

    .series-score strong {
      color: #fff;
      font-size: 1.45rem;
    }

    .declaration {
      margin: 22px 0 0;
      padding: 16px 14px;
      border-radius: 14px;
      color: var(--ink);
      background: linear-gradient(180deg, #fff5db, #f7dfab);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
    }

    .declaration span {
      display: block;
      color: #85642b;
      font-size: 0.72rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .declaration strong {
      font-size: 1.18rem;
    }

    .momentum {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 15px;
    }

    .momentum-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 10px;
    }

    .rounds {
      display: grid;
      gap: 8px;
    }

    .round {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f8f4ed;
      font-size: 0.82rem;
    }

    .round.win {
      color: #2e7048;
      background: var(--green-soft);
      font-weight: 700;
    }

    .round.pending {
      color: var(--muted);
      border: 1px dashed var(--line);
      background: transparent;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: 0 28px 28px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 12px;
      font-size: 0.96rem;
    }

    .breakdown {
      display: grid;
      gap: 9px;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .breakdown-row strong {
      color: var(--ink);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      min-height: 42px;
      border-radius: 12px;
      padding: 0 18px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .actions .primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      box-shadow: 0 10px 22px rgba(72,108,168,0.22);
    }

    .actions .danger {
      border-color: rgba(200,85,77,0.28);
      color: var(--red);
      background: var(--red-soft);
    }

    @media (max-width: 900px) {
      .topline { align-items: flex-start; flex-direction: column; }
      .scenario-tabs { justify-content: flex-start; }
      .hero { grid-template-columns: 1fr; }
      .center { order: -1; }
      .player { min-height: auto; }
      .details { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .page { padding: 16px; }
      .hero, .details { padding: 16px; }
      .stats { grid-template-columns: 1fr; }
      .topline { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="settlement" aria-label="PK 结算页预览">
      <header class="topline">
        <div class="brand">
          <div class="eyebrow">VOCABNOTE ARENA</div>
          <h1 class="title">决斗结算页预览</h1>
        </div>
        <div class="scenario-tabs" aria-label="结算剧情切换">
          <button class="active" data-scenario="first">首胜</button>
          <button data-scenario="revenge">复仇</button>
          <button data-scenario="sweep">完胜</button>
          <button data-scenario="final">总胜</button>
        </div>
      </header>

      <div class="hero">
        <article class="player winner" id="winnerCard">
          <span class="rank-pill" id="winnerRank">#2</span>
          <div class="player-header">
            <div class="avatar-wrap">
              <svg class="crown" viewBox="0 0 64 44" aria-hidden="true">
                <path fill="currentColor" d="M7 38h50l-4 6H11l-4-6Zm4-27 13 12 8-21 8 21 13-12-4 23H15L11 11Z"/>
              </svg>
              <div class="avatar" style="background: linear-gradient(135deg,#d68554,#9f3f45);">叶</div>
            </div>
            <div class="player-name">
              <strong id="winnerName">叶陌钧</strong>
              <span id="winnerMeta">217 分 · 胜率 69%</span>
            </div>
          </div>
          <div class="score-block">
            <span class="score-label">本局得分</span>
            <div class="score" id="winnerScore">14</div>
            <span class="delta up" id="winnerDelta">积分 +12</span>
          </div>
          <div class="stats">
            <div class="stat"><span>排名变化</span><strong id="winnerMove">+1</strong></div>
            <div class="stat"><span>最高连击</span><strong id="winnerStreak">6</strong></div>
            <div class="stat"><span>今日净胜</span><strong id="winnerNet">+28</strong></div>
          </div>
        </article>

        <section class="center">
          <div class="result-card">
            <div class="round-tag" id="roundTag">第一局 · 先下一城</div>
            <h2 class="result-title" id="resultTitle">首胜到手</h2>
            <div class="series-score">
              <span>BO3</span>
              <strong id="seriesScore">1 : 0</strong>
              <span id="seriesHint">败方可申请再战</span>
            </div>
            <div class="declaration">
              <span id="quoteType">首胜宣言</span>
              <strong id="declarationText">开局先收下</strong>
            </div>
          </div>

          <div class="momentum">
            <div class="momentum-title">
              <strong>对战进程</strong>
              <span id="rematchState">对方剩 1 次再战权</span>
            </div>
            <div class="rounds" id="rounds"></div>
          </div>
        </section>

        <article class="player loser" id="loserCard">
          <span class="rank-pill" id="loserRank">#9</span>
          <div class="player-header">
            <div class="avatar-wrap">
              <div class="avatar" style="background: linear-gradient(135deg,#4f75b8,#243e73);">周</div>
            </div>
            <div class="player-name">
              <strong id="loserName">周凛</strong>
              <span id="loserMeta">168 分 · 胜率 57%</span>
            </div>
          </div>
          <div class="score-block">
            <span class="score-label">本局得分</span>
            <div class="score" id="loserScore">9</div>
            <span class="delta down" id="loserDelta">积分 -6</span>
          </div>
          <div class="stats">
            <div class="stat"><span>排名变化</span><strong id="loserMove">-1</strong></div>
            <div class="stat"><span>最高连击</span><strong id="loserStreak">4</strong></div>
            <div class="stat"><span>今日净胜</span><strong id="loserNet">+10</strong></div>
          </div>
        </article>
      </div>

      <div class="details">
        <section class="panel">
          <h3>积分结算</h3>
          <div class="breakdown">
            <div class="breakdown-row"><span>胜负基础分</span><strong id="basePoints">+10</strong></div>
            <div class="breakdown-row"><span>连击奖励</span><strong id="streakPoints">+4</strong></div>
            <div class="breakdown-row"><span>排名差修正</span><strong id="rankModifier">-2</strong></div>
            <div class="breakdown-row"><span>最终变化</span><strong id="finalPoints">+12</strong></div>
          </div>
        </section>
        <section class="panel">
          <h3>下一步</h3>
          <div class="actions">
            <button class="primary">赛场回顾</button>
            <button id="rematchButton" class="danger">申请再战</button>
            <button>返回刷题</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const scenarios = {
      first: {
        roundTag: "第一局 · 先下一城",
        resultTitle: "首胜到手",
        seriesScore: "1 : 0",
        seriesHint: "败方可申请再战",
        quoteType: "首胜宣言",
        declarationText: "开局先收下",
        rematchState: "对方剩 1 次再战权",
        winnerScore: 14,
        loserScore: 9,
        winnerDelta: "积分 +12",
        loserDelta: "积分 -6",
        basePoints: "+10",
        streakPoints: "+4",
        rankModifier: "-2",
        finalPoints: "+12",
        rematchButton: "等待对方再战",
        rounds: [
          ["第一局", "叶陌钧胜", "win"],
          ["第二局", "未开始", "pending"],
          ["第三局", "未开启", "pending"]
        ]
      },
      revenge: {
        roundTag: "第二局 · 扳回一城",
        resultTitle: "复仇成功",
        seriesScore: "1 : 1",
        seriesHint: "进入决胜压力",
        quoteType: "复仇宣言",
        declarationText: "现在轮到我",
        rematchState: "双方再战权已用尽",
        winnerName: "周凛",
        loserName: "叶陌钧",
        winnerRank: "#9",
        loserRank: "#2",
        winnerMeta: "174 分 · 胜率 58%",
        loserMeta: "211 分 · 胜率 68%",
        winnerScore: 13,
        loserScore: 11,
        winnerDelta: "积分 +16",
        loserDelta: "积分 -10",
        basePoints: "+10",
        streakPoints: "+2",
        rankModifier: "+4",
        finalPoints: "+16",
        rematchButton: "开启决胜局",
        rounds: [
          ["第一局", "叶陌钧胜", "pending"],
          ["第二局", "周凛胜", "win"],
          ["第三局", "待确认", "pending"]
        ]
      },
      sweep: {
        roundTag: "第二局 · 2:0 终结",
        resultTitle: "完胜收场",
        seriesScore: "2 : 0",
        seriesHint: "本组对决结束",
        quoteType: "完胜宣言",
        declarationText: "两局够了",
        rematchState: "已无再战机会",
        winnerScore: 16,
        loserScore: 8,
        winnerDelta: "积分 +10",
        loserDelta: "积分 -7",
        basePoints: "+10",
        streakPoints: "+2",
        rankModifier: "-2",
        finalPoints: "+10",
        rematchButton: "对决已结束",
        rounds: [
          ["第一局", "叶陌钧胜", "win"],
          ["第二局", "叶陌钧胜", "win"],
          ["第三局", "未开启", "pending"]
        ]
      },
      final: {
        roundTag: "第三局 · 决胜时刻",
        resultTitle: "总胜加冕",
        seriesScore: "2 : 1",
        seriesHint: "BO3 最终胜者",
        quoteType: "总胜宣言",
        declarationText: "这局我收了",
        rematchState: "三局结束",
        winnerScore: 15,
        loserScore: 13,
        winnerDelta: "积分 +18",
        loserDelta: "积分 -9",
        basePoints: "+10",
        streakPoints: "+4",
        rankModifier: "+4",
        finalPoints: "+18",
        rematchButton: "对决已结束",
        rounds: [
          ["第一局", "周凛胜", "pending"],
          ["第二局", "叶陌钧胜", "win"],
          ["第三局", "叶陌钧胜", "win"]
        ]
      }
    };

    const defaults = {
      winnerName: "叶陌钧",
      loserName: "周凛",
      winnerRank: "#2",
      loserRank: "#9",
      winnerMeta: "217 分 · 胜率 69%",
      loserMeta: "168 分 · 胜率 57%"
    };

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function renderRounds(rows) {
      document.getElementById("rounds").innerHTML = rows.map(([name, result, cls]) =>
        `<div class="round ${cls}"><span>${name}</span><strong>${result}</strong></div>`
      ).join("");
    }

    function applyScenario(name) {
      const data = { ...defaults, ...scenarios[name] };
      Object.keys(data).forEach((key) => {
        if (key !== "rounds") setText(key, data[key]);
      });
      renderRounds(data.rounds);
      document.querySelectorAll(".scenario-tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.scenario === name);
      });
    }

    document.querySelectorAll(".scenario-tabs button").forEach((button) => {
      button.addEventListener("click", () => applyScenario(button.dataset.scenario));
    });

    applyScenario("first");
  </script>
</body>
</html>
